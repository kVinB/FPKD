services:
  seizure-diary:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: seizure-diary:0.1.0
    restart: unless-stopped
    env_file:
      - ./.env
    # Bind to loopback on the guest; terminate HTTPS in the private reverse proxy.
    # For a separate proxy host, bind a private interface address instead, e.g.
    # "10.0.0.5:3000:3000", and firewall it to the proxy only.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - seizure-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  seizure-data:
    driver: local
