name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-24.04
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version="$(node scripts/build-version.mjs)"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          printf 'build_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Build version: %s\n' "$version"

  verify:
    needs: version
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
    name: Typecheck, tests, build, browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install PDF render tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - name: Audit dependencies
        run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility tests
        env:
          E2E_BROWSERS: all
          PDF_RENDER: "1"
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image and Compose smoke test
    needs: version
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg BUILD_VERSION="$BUILD_VERSION" -t seizure-diary:ci .
      - name: Verify the runtime user is non-root
        run: |
          docker run --rm --entrypoint id seizure-diary:ci | tee /tmp/id.txt
          grep -q 'uid=1000' /tmp/id.txt
      - name: Prepare CI-only environment
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's#^PUBLIC_ORIGIN=.*#PUBLIC_ORIGIN=http://127.0.0.1:3000#' deploy/.env
          sed -i 's#^SECURE_COOKIES=.*#SECURE_COOKIES=false#' deploy/.env
          sed -i "s#^CSRF_SECRET=.*#CSRF_SECRET=$(openssl rand -base64 32)#" deploy/.env
          printf '\nBUILD_VERSION=%s\n' "$BUILD_VERSION" >> deploy/.env
      - name: Start Compose service
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for health and smoke test
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            container="$(docker compose -f deploy/docker-compose.yml ps -q seizure-diary)"
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
            if [ "$attempt" = "60" ]; then
              docker compose -f deploy/docker-compose.yml logs --no-color
              exit 1
            fi
          done
          curl -fsS http://127.0.0.1:3000/api/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/events/query)" = "401"
          curl -fsS http://127.0.0.1:3000/ | grep -qi 'Seizure Diary'
      - name: Stop Compose service
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  tag:
    name: Tag successful main build
    needs: [version, verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create build tag
        env:
          VERSION: ${{ needs.version.outputs.build_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]; then
            echo "main moved after this build; skipping stale tag"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists"
            exit 0
          fi
          git tag -a "$VERSION" -m "Seizure Diary build $VERSION" -m "Commit: $TARGET_SHA"
          if ! git push origin "refs/tags/$VERSION"; then
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "tag $VERSION created by another run"
              exit 0
            fi
            exit 1
          fi
          echo "Tagged $VERSION"

  release:
    name: Publish deployment bundle
    needs: [version, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.build_version }}
          fetch-depth: 0
      - name: Build deployment bundle in Debian 12
        env:
          VERSION: ${{ needs.version.outputs.build_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e BUILD_VERSION="$VERSION" \
            node:22.13.1-bookworm-slim \
            bash -lc 'npm ci && npm run build && npm prune --omit=dev'
          rm -rf bundle
          mkdir bundle
          cp -a dist node_modules package.json package-lock.json deploy bundle/
          tar -czf "seizure-diary-$VERSION.tar.gz" -C bundle .
          sha256sum "seizure-diary-$VERSION.tar.gz" > "seizure-diary-$VERSION.tar.gz.sha256"
          node scripts/package-installer.mjs --version "$VERSION" --commit "$TARGET_SHA"             --out "seizure-diary-installer-$VERSION.sh"
          sha256sum "seizure-diary-installer-$VERSION.sh" > "seizure-diary-installer-$VERSION.sh.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.build_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          assets=(
            "seizure-diary-$VERSION.tar.gz"
            "seizure-diary-$VERSION.tar.gz.sha256"
            "seizure-diary-installer-$VERSION.sh"
            "seizure-diary-installer-$VERSION.sh.sha256"
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" \
              --title "Seizure Diary $VERSION" \
              --notes "Automated deployment bundle and self-contained Proxmox installer for $TARGET_SHA. Use synthetic data until deployment acceptance checks are complete." \
              "${assets[@]}"
          fi
